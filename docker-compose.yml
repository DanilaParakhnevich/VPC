services:
  broker:
    image: confluentinc/cp-kafka:latest
    container_name: broker
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - broker-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - broker-network

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: gateway-service
    depends_on:
      broker:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: gateway
      LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-DEBUG}
      ACTUATOR_USER: ${GATEWAY_ACTUATOR_USER:-admin}
      ACTUATOR_PASSWORD: ${GATEWAY_ACTUATOR_PASSWORD:-admin123}
      SERVER_PORT: ${GATEWAY_PORT:-8080}
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "${GATEWAY_SERVICE_SERVER_PORT:-8080}:8080"
      - "${GATEWAY_SERVICE_DEBUGGER_PORT:-5005}:5005"
    volumes:
      - gateway_logs:/var/log/gateway-service
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - broker-network

  users-db:
    image: postgres:16-alpine
    container_name: users-db
    environment:
      POSTGRES_DB: ${USERS_DB_NAME:-users}
      POSTGRES_USER: ${USERS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-postgres}
    ports:
      - "${USER_SERVICE_DATABASE_PORT:-5432}:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${USERS_DB_USER:-postgres} -d ${USERS_DB_NAME:-users}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - user-network

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    depends_on:
      users-db:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVER: broker:9092
      DATASOURCE_HOST: users-db
      DATASOURCE_PORT: 5432
      DATASOURCE_DATABASE: users
      DATASOURCE_USERNAME: ${USERS_DB_USER:-postgres}
      DATASOURCE_PASSWORD: ${USERS_DB_PASSWORD:-1234}
      JPA_SHOW_SQL: ${USERS_SHOW_SQL:-false}
      LOG_LEVEL: ${USERS_LOG_LEVEL:-DEBUG}
      ACTUATOR_USER: ${USERS_ACTUATOR_USER:-admin}
      ACTUATOR_PASSWORD: ${USERS_ACTUATOR_PASSWORD:-admin123}
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "${USER_SERVICE_DEBUGGER_PORT:-5006}:5005"
      - "${USER_SERVICE_SERVER_PORT:-8082}:8080"
    volumes:
      - user_logs:/var/log/user-service
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - user-network
      - broker-network

  music-db:
    image: postgres:16-alpine
    container_name: music-db
    environment:
      POSTGRES_DB: ${MUSIC_DB_NAME:-music}
      POSTGRES_USER: ${MUSIC_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${MUSIC_DB_PASSWORD:-1234}
    ports:
      - "${MUSIC_SERVICE_DATABASE_PORT:-5433}:5432"
    volumes:
      - music_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${MUSIC_DB_USER:-postgres} -d ${MUSIC_DB_NAME:-music}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - music-network

  music-service:
    build:
      context: .
      dockerfile: music-service/Dockerfile
    container_name: music-service
    depends_on:
      music-db:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVER: broker:9092
      DATASOURCE_HOST: music-db
      DATASOURCE_PORT: 5432
      DATASOURCE_DATABASE: music
      DATASOURCE_USERNAME: ${MUSIC_DB_USER:-postgres}
      DATASOURCE_PASSWORD: ${MUSIC_DB_PASSWORD:-1234}
      JPA_SHOW_SQL: ${MUSIC_SHOW_SQL:-false}
      LOG_LEVEL: ${MUSIC_LOG_LEVEL:-DEBUG}
      ACTUATOR_USER: ${MUSIC_ACTUATOR_USER:-admin}
      ACTUATOR_PASSWORD: ${MUSIC_ACTUATOR_PASSWORD:-admin123}
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "5007:5005"
      - "${MUSIC_SERVICE_SERVER_PORT:-8083}:8080"
    volumes:
      - music_logs:/var/log/music-service
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - music-network
      - broker-network

  media-service:
    build:
      context: .
      dockerfile: media-service/Dockerfile
    container_name: media-service
    depends_on:
      redis:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVER: broker:9092
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      MEDIA_STORAGE_DIR: /data/media
      LOG_LEVEL: ${MEDIA_LOG_LEVEL:-DEBUG}
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "${MEDIA_SERVICE_DEBUGGER_PORT:-5008}:5005"
      - "${MEDIA_SERVICE_SERVER_PORT:-8084}:8080"
    volumes:
      - media_data:/data/media
      - media_logs:/var/log/media-service
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/q/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - broker-network

volumes:
  redis_data:
  gateway_logs:
  user_postgres_data:
  music_postgres_data:
  media_data:
  user_logs:
  music_logs:
  media-logs:

networks:
  broker-network:
    driver: bridge
  user-network:
    driver: bridge
  music-network:
    driver: bridge