services:
  broker:
    profiles: [ "all", "broker" ]
    image: confluentinc/cp-kafka:latest
    container_name: broker
    ports:
      - "9092:9092"
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - broker-network

  gateway-service:
    profiles: [ "all", "gateway", "services" ]
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: gateway-service
    depends_on:
      broker:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: gateway
      LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-DEBUG}
      ACTUATOR_USER: ${GATEWAY_ACTUATOR_USER:-admin}
      ACTUATOR_PASSWORD: ${GATEWAY_ACTUATOR_PASSWORD:-admin123}
      SERVER_PORT: ${GATEWAY_PORT:-8080}
    ports:
      - "8080:8080"
      - "8082:8082"
      - "5005:5005"
    volumes:
      - gateway_logs:/var/log/gateway-service
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - broker-network

  users-db:
    profiles: [ "all", "users", "users-db", "services" ]
    image: postgres:16-alpine
    container_name: users-db
    environment:
      POSTGRES_DB: ${DB_NAME:-users}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-users}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - user-network

  user-service:
    profiles: [ "all", "users", "users-service", "services" ]
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    depends_on:
      users-db:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVER: broker:9092
      DATASOURCE_HOST: users-db
      DATASOURCE_PORT: 5432
      DATASOURCE_DATABASE: users
      DATASOURCE_USERNAME: ${USERS_DB_USER:-postgres}
      DATASOURCE_PASSWORD: ${USERS_DB_PASSWORD:-postgres}
      JPA_SHOW_SQL: ${USERS_SHOW_SQL:-false}
      LOG_LEVEL: ${USERS_LOG_LEVEL:-DEBUG}
      ACTUATOR_USER: ${USERS_ACTUATOR_USER:-admin}
      ACTUATOR_PASSWORD: ${USERS_ACTUATOR_PASSWORD:-admin123}
    ports:
      - "5006:5005"
    volumes:
      - user_logs:/var/log/user-service
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - user-network
      - broker-network

volumes:
  postgres_data:
  user_logs:
  gateway_logs:

networks:
  user-network:
    driver: bridge
  broker-network:
    driver: bridge