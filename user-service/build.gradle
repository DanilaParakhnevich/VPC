plugins {
    id 'java'
    id 'io.quarkus' version '3.14.0'
    id 'io.freefair.lombok' version "${lombokVersion}"
    id 'org.flywaydb.flyway' version "${flywayVersion}"
}

group = 'by.parakhnevich'
version = '1.0.0'

java {
    sourceCompatibility = '21'
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    quarkusVersion = '3.14.0'
    mapstructVersion = '1.6.3'
}

dependencies {
    // Quarkus BOM
    implementation enforcedPlatform("io.quarkus.platform:quarkus-bom:${quarkusVersion}")

    // Quarkus core
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-hibernate-orm'
    implementation 'io.quarkus:quarkus-hibernate-validator'
    implementation 'io.quarkus:quarkus-jdbc-postgresql'
    implementation 'io.quarkus:quarkus-flyway'

    // Kafka (SmallRye Reactive Messaging)
    implementation 'io.quarkus:quarkus-smallrye-reactive-messaging-kafka'

    // Security (BCrypt)
    implementation 'org.springframework.security:spring-security-crypto:6.3.0'

    // Cache
    implementation 'io.quarkus:quarkus-cache'

    // Jackson + JavaTime
    implementation 'io.quarkus:quarkus-jackson'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // MapStruct
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    // Metrics & Health
    implementation 'io.quarkus:quarkus-micrometer'
    implementation 'io.quarkus:quarkus-smallrye-health'

    // Logging JSON
    implementation 'io.quarkus:quarkus-logging-json'

    // Common module (ваш общий DTO)
    implementation project(":common-dto")

    // Test
    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.rest-assured:rest-assured'
}

quarkus {
    // Для нативной компиляции
    buildNative {
        additionalBuildArgs = ['--enable-url-protocols=http,https']
    }
}

flyway {
    url = 'jdbc:postgresql://localhost:5432/users'
    user = 'user'
    password = 'password'
    locations = ['filesystem:src/main/resources/db/migration']
}