quarkus.application.name=user-service
quarkus.http.port=8081
quarkus.http.host=0.0.0.0

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVER:broker:9092}

mp.messaging.incoming.users-request.connector=smallrye-kafka
mp.messaging.incoming.users-request.topic=users-request
mp.messaging.incoming.users-request.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.users-request.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

mp.messaging.outgoing.users-response.connector=smallrye-kafka
mp.messaging.outgoing.users-response.topic=users-response
mp.messaging.outgoing.users-response.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.users-response.value.serializer=org.apache.kafka.common.serialization.StringSerializer

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${DATASOURCE_HOST:users-db}:${DATASOURCE_PORT:5432}/${DATASOURCE_DATABASE:users}
quarkus.datasource.username=${DATASOURCE_USERNAME:user}
quarkus.datasource.password=${DATASOURCE_PASSWORD:password}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.initial-size=5
quarkus.datasource.jdbc.acquisition-timeout=PT15S
quarkus.datasource.jdbc.leak-detection-interval=PT10S
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=${JPA_SHOW_SQL:false}
quarkus.hibernate-orm.log.format-sql=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=db/migration

quarkus.log.console.json=false
quarkus.log.level=INFO
quarkus.log.category."by.parakhnevich.user".level=${LOG_LEVEL:DEBUG}
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.file.enable=true
quarkus.log.file.path=/var/log/user-service/app.log
quarkus.log.file.rotation.max-file-size=100M
quarkus.log.file.rotation.max-backup-index=30
quarkus.log.file.format=%d{ISO_OFFSET_DATE_TIME} %-5p [%c] (%t) %s%e%n

